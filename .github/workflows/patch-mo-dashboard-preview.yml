name: Preview MO Dashboard Product Warehouse Patch

on:
  push:
    branches:
      - backup-before-dashboard-rollback-20260909
    paths:
      - ".github/workflows/patch-mo-dashboard-preview.yml"
      - ".github/scripts/patch_mo_dashboard_product_warehouse.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup-before-dashboard-rollback-20260909
          fetch-depth: 0
      - name: Apply dashboard patch
        run: python .github/scripts/patch_mo_dashboard_product_warehouse.py
      - name: Build check
        run: |
          npm install
          npm run build
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No application changes."
            exit 0
          fi
          git commit -m "Group dashboard finished goods by product and warehouse"
          git push origin backup-before-dashboard-rollback-20260909
