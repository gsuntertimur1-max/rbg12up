name: Apply Admin Physical TM QC Preview

on:
  push:
    branches:
      - backup-before-dashboard-rollback-20260909
    paths:
      - ".github/workflows/apply-admin-physical-tm-qc-preview.yml"
      - ".github/scripts/patch_admin_physical_tm_qc_core.py"
      - ".github/scripts/patch_admin_physical_tm_qc_ui.py"

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup-before-dashboard-rollback-20260909
          fetch-depth: 0
      - name: Apply core data-flow patch
        run: python .github/scripts/patch_admin_physical_tm_qc_core.py
      - name: Apply UI and dashboard patch
        run: python .github/scripts/patch_admin_physical_tm_qc_ui.py
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Commit verified application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No application changes."
            exit 0
          fi
          git commit -m "Separate administrative and physical stock and move TM result to QC"
          git push origin backup-before-dashboard-rollback-20260909
