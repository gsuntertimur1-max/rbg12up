name: One-time UI copy cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-ui-copy-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplify dashboard and QC copy
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/App.jsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''                  <p className="mt-2 max-w-3xl text-sm leading-6 text-slate-500">\n                    Ringkasan stok aktif, status produk jadi, QC, dan risiko kedaluwarsa.\n                    Kuantitas ditampilkan per satuan agar KG, Pack, PCS, dan Karton tidak tercampur.\n                  </p>''',
                  '''                  <p className="mt-2 max-w-3xl text-sm leading-6 text-slate-500">\n                    Ringkasan stok dan persediaan aktif gudang.\n                  </p>''',
              ),
              (
                  '''                      <p className="mt-2 max-w-xl text-sm leading-6 text-slate-300">\n                        Bahan baku dan produk jadi dipisahkan berdasarkan satuan dan status agar saldo lebih mudah dibaca.\n                      </p>\n''',
                  '''''',
              ),
              (
                  '''              <div><h1 className="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight">Quality Control</h1><p className="mt-2 text-sm text-slate-500">QC Bahan Masuk mengendalikan bahan yang boleh dipakai Rebagging. QC Produk Jadi mengendalikan batch yang boleh Outbound.</p></div>''',
                  '''              <h1 className="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight">Quality Control</h1>''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly 1 match, found {count}: {old[:90]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/cleanup-ui-copy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/cleanup-ui-copy-once.yml
          git commit -m "style: simplify dashboard and QC copy"
          git push origin HEAD:main
