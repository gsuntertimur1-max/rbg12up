name: One-time ISO SNI Document Control Patch

on:
  push:
    paths:
      - ".github/workflows/patch-iso-sni.yml"
      - ".github/scripts/patch_iso_sni_doc_control.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply document control patch
        run: python .github/scripts/patch_iso_sni_doc_control.py
      - name: Commit App changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add controlled rebag document metadata and standards snapshot"
          git push
