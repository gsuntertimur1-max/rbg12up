name: One-time operational hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/operational-hardening-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare patch script
        run: python .github/scripts/fix_operational_patch.py

      - name: Apply patch
        run: python .github/scripts/operational_hardening_patch.py

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify markers
        run: |
          grep -q "Cek Konsistensi Stok & Ledger" src/components/IntegrityPanel.jsx
          grep -q "PREVIEW IMPORT DATA LAMA" src/lib/operationalEnhancements.js
          grep -q "Restore Arsip Excel" src/App.jsx
          grep -q "closedThroughMonth" src/App.jsx
          grep -q "OperationalActionCenter" src/App.jsx
          test -f src/components/InventoryMobileCards.jsx

      - name: Remove one-time automation and commit
        run: |
          rm .github/workflows/operational-hardening-once.yml
          rm .github/scripts/operational_hardening_patch.py
          rm .github/scripts/fix_operational_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/lib/operationalEnhancements.js src/components/OperationalActionCenter.jsx src/components/IntegrityPanel.jsx src/components/InventoryMobileCards.jsx .github/workflows/operational-hardening-once.yml .github/scripts/operational_hardening_patch.py .github/scripts/fix_operational_patch.py
          git commit -m "feat: harden operations, import, archive and mobile UX"
          git push origin HEAD:main
