          # Restore button alongside archive/reset.
          restore_button = r'''                        <label className={`inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl border border-teal-200 bg-teal-50 px-5 py-3 text-sm font-black text-teal-700 hover:bg-teal-100 ${restoreArchiveLoading ? "pointer-events-none opacity-50" : ""}`}>
                          <FileUp size={18}/> {restoreArchiveLoading ? "Merestore..." : "Restore Arsip Excel"}
                          <input type="file" accept=".xlsx,.xls" className="hidden" disabled={restoreArchiveLoading || resetHistoryLoading || legacyImportLoading} onChange={handleRestoreOperationalArchive}/>
                        </label>

'''
          replace_once(
              '''                        <button\n                          type="button"\n                          onClick={handleResetTransactionHistory}''',
              restore_button + '''                        <button\n                          type="button"\n                          onClick={handleResetTransactionHistory}''',
              "restore archive button",
          )

          # Disable destructive/import buttons while Restore is running.
          text = text.replace(
              'legacyImportLoading || resetHistoryLoading',
              'legacyImportLoading || resetHistoryLoading || restoreArchiveLoading'
          )
          text = text.replace(
              'resetHistoryLoading || legacyImportLoading',
              'resetHistoryLoading || legacyImportLoading || restoreArchiveLoading'
          )

          # Keep App.jsx on the safe side: new functionality is modular, existing flows stay in place.
          app_path.write_text(text, encoding="utf-8")

      - name: Install dependencies and build
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify hardening markers
        shell: bash
        run: |
          grep -q "Cek Konsistensi Stok & Ledger" src/components/IntegrityPanel.jsx
          grep -q "PREVIEW IMPORT DATA LAMA" src/lib/operationalEnhancements.js
          grep -q "Restore Arsip Excel" src/App.jsx
          grep -q "closedThroughMonth" src/App.jsx
          grep -q "OperationalActionCenter" src/App.jsx
          test -f src/components/InventoryMobileCards.jsx

      - name: Remove one-time workflow and commit final bundle
        shell: bash
        run: |
          rm .github/workflows/operational-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/lib/operationalEnhancements.js src/components/OperationalActionCenter.jsx src/components/IntegrityPanel.jsx src/components/InventoryMobileCards.jsx .github/workflows/operational-hardening-once.yml
          git commit -m "feat: harden operations, import, archive and mobile UX"
          git push origin HEAD:main
