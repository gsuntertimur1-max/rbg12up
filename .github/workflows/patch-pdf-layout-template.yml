name: One-time PDF Layout Template Patch

on:
  push:
    paths:
      - ".github/workflows/patch-pdf-layout-template.yml"
      - ".github/scripts/patch_pdf_layout_template.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PDF layout template patch
        run: python .github/scripts/patch_pdf_layout_template.py
      - name: Commit App changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Improve rebag PDF layout using Excel template"
          git push
