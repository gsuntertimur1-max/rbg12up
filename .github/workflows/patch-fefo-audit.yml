name: One-time FEFO Override Audit

on:
  push:
    paths:
      - ".github/workflows/patch-fefo-audit.yml"
      - ".github/scripts/patch_fefo_override_audit.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply FEFO override audit
        run: python .github/scripts/patch_fefo_override_audit.py
      - name: Commit App changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Require reasons for FEFO and expired overrides"
          git push
