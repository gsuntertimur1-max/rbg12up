name: One-time Point 4 Safe Reset UI

on:
  push:
    paths:
      - ".github/workflows/patch-points-1-4.yml"
      - ".github/scripts/patch_point_4_reset_ui.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe reset UI
        run: python .github/scripts/patch_point_4_reset_ui.py
      - name: Commit App changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Replace history reset UI with archive and safe test reset"
          git push
