name: One-time TM UI Patch

on:
  push:
    paths:
      - ".github/workflows/patch-tm-mo-batch.yml"
      - ".github/scripts/patch_tm_ui.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI patch
        run: python .github/scripts/patch_tm_ui.py

      - name: Commit App patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No App.jsx changes needed."
            exit 0
          fi
          git commit -m "Update TM-MO batch UI and traceability"
          git push
