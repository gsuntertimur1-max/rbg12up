name: One-time Rebag SOP reference update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/set-rebag-sop-once.yml"

permissions:
  contents: write

jobs:
  update-sop-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SOP reference migration
        run: python .github/scripts/set_rebag_sop.py

      - name: Build application
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify change
        run: |
          grep -q "41/PR/2023 – Prosedur Produksi, Rev. 1, 05 April 2023" src/App.jsx
          grep -q "Gagal mengisi referensi SOP/WI default" src/App.jsx

      - name: Commit final change
        run: |
          rm .github/workflows/set-rebag-sop-once.yml
          rm .github/scripts/set_rebag_sop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/set-rebag-sop-once.yml .github/scripts/set_rebag_sop.py
          git commit -m "docs: set official rebag production SOP reference"
          git push origin HEAD:main
